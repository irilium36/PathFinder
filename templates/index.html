<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 知识树生成器</title>
    <meta
      name="description"
      content="AI 知识结构反卷生成器：将零散笔记转化为技能树式知识图谱与学习路径。"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/dist/vis-network.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <h1>AI 知识树生成器</h1>
          <p class="hero-copy">上传 PDF 或 PPT，提取文本，生成结构化知识图谱，支持保存学习状态。</p>
        </div>
        <div class="hero-actions">
          <button id="modeToggle" class="btn primary">学习路径模式</button>
          <button id="themeToggle" class="btn">切换主题</button>
        </div>
      </header>

      <main class="dashboard">
        <aside class="sidebar left">
          <section class="card upload-card">
            <h2>1. 上传 PDF/PPT</h2>
            <form id="uploadForm" class="upload-form">
              <input
                type="file"
                id="pdfFile"
                accept="application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,.ppt,.pptx"
              />
              <button type="submit" class="btn primary">提取文本</button>
            </form>
            <div id="uploadStatus" class="status">等待上传 PDF / PPT</div>
          </section>

          <section class="card source-card">
            <h2>2. 输入文本</h2>
            <textarea id="sourceText" rows="10" placeholder="粘贴课堂笔记、教材摘要、实验讲义..."></textarea>
            <div class="row-actions">
              <button id="generateBtn" class="btn primary">生成图谱</button>
              <button id="saveBtn" class="btn">保存到本地</button>
            </div>
          </section>
        </aside>

        <section class="workspace">
          <div class="workspace-top">
            <div>
              <h2>知识图谱画布</h2>
              <p>支持节点拖拽、缩放、点击查看详情；推荐路径会在“学习路径模式”下自动高亮。</p>
            </div>
            <div class="stats">
              <div><strong id="nodeCount">0</strong><span>节点</span></div>
              <div><strong id="edgeCount">0</strong><span>关系</span></div>
              <div><strong id="savedCount">0</strong><span>本地记录</span></div>
            </div>
          </div>
          <div id="network" class="network-canvas"></div>
          <div id="summary" class="summary-card">尚未生成图谱。请先上传 PDF 或输入文本。</div>
        </section>

        <aside class="sidebar right">
          <section class="card detail-card">
            <h2>节点详情</h2>
            <div id="detailName" class="detail-name">未选择节点</div>
            <p id="detailText">点击左侧图谱中的节点查看内容。</p>
            <div id="detailTags" class="tag-list"></div>
            <button id="expandContentBtn" class="btn expand-btn">查看完整知识内容</button>
          </section>

          <section class="card full-content-card" id="fullContentCard">
            <h2>完整知识内容</h2>
            <div id="fullContentTitle" class="detail-name">请选择一个节点</div>
            <div id="fullContentBody" class="full-content-body">节点完整知识内容会显示在这里。</div>
          </section>

          <section class="card storage-card">
            <h2>本地存储</h2>
            <p>用户关闭浏览器后仍能保留上次学习状态。</p>
            <button id="clearStorageBtn" class="btn danger">清除本地数据</button>
          </section>
        </aside>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
