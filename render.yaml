services:
  - type: web
    name: ai-knowledge-tree
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: COZE_API_URL
        sync: false
      - key: COZE_API_KEY
        sync: false
      - key: COZE_API_TYPE
        value: chat
      - key: COZE_BOT_ID
        sync: false
      - key: COZE_USER_ID
        value: pathfinder-user